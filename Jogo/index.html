<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pacman 3D </title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #0e1116;
            --panel: rgba(16, 20, 28, 0.82);
            --text: #eef2ff;
            --muted: #aab3c5;
            --accent: #7dd3fc;
            --border: rgba(148, 163, 184, 0.18);
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background:
                radial-gradient(circle at top left, rgba(56, 189, 248, 0.20), transparent 32%),
                radial-gradient(circle at bottom right, rgba(14, 165, 233, 0.14), transparent 28%),
                linear-gradient(180deg, #0a0d12, var(--bg));
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
            color: var(--text);
        }

        #app {
            position: fixed;
            inset: 0;
        }

        canvas {
            display: block;
        }

        .overlay {
            position: fixed;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 180px;
            max-width: 180px;
            padding: 12px 12px;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: rgba(16, 20, 28, 0.68);
            backdrop-filter: blur(8px);
            box-shadow: 0 14px 34px rgba(0, 0, 0, 0.28);
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .overlay h1 {
            margin: 0;
            font-size: 0.92rem;
            letter-spacing: 0.02em;
        }

        .overlay p {
            margin: 0;
            color: var(--muted);
            line-height: 1.4;
            font-size: 0.82rem;
        }

        .overlay .hint {
            display: inline-block;
            margin-top: 4px;
            padding: 5px 8px;
            border-radius: 999px;
            border: 1px solid rgba(125, 211, 252, 0.22);
            color: var(--accent);
            font-size: 0.76rem;
            line-height: 1.25;
        }

        .footer {
            position: fixed;
            right: 16px;
            bottom: 16px;
            padding: 10px 12px;
            border-radius: 999px;
            background: rgba(8, 12, 18, 0.72);
            border: 1px solid var(--border);
            color: var(--muted);
            font-size: 0.82rem;
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.173.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.173.0/examples/jsm/"
            }
        }
    </script>
    <script type="module" src="./js/main.js"></script>
</body>
</html>
